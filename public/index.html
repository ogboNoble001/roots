<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roots — Clinical Lifestyle Intelligence</title>
  <style>
    /* Bundled Local New York Serif */
    @font-face {
      font-family: 'New York';
      src: url('/fonts/NewYork.otf') format('opentype');
      font-weight: 300 400;
      font-style: normal;
      font-display: swap;
    }

    /* Bundled Local Circular Std for Body */
    @font-face {
      font-family: 'Circular Std';
      src: url('/fonts/CircularStd-Book.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Circular Std';
      src: url('/fonts/CircularStd-Medium.woff') format('woff');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Circular Std';
      src: url('/fonts/CircularStd-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Sleek Dark Graphite / Charcoal / Near-Black Palette */
      --bg-main: #121212;
      --bg-sidebar: #171717;
      --surface-box: #1E1E1E;
      --surface-card: #181818;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.22);
      --text-primary: #F0F0EE;
      --text-secondary: #94938F;
      --text-placeholder: #5C5B57;
      --pill-bg: #242423;
      --pill-active: #323230;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: 'Circular Std', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    .app-layout {
      min-height: 100vh;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* Blurred Backdrop Overlay when Sidebar is open */
    .sidebar-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 45;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .sidebar-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Slide-out Sidebar covering the side with blur behind */
    .sidebar {
      width: 320px;
      max-width: 86vw;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 18px 16px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.26s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 12px 4px;
    }

    .sidebar-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* + New Consultation Button in Sidebar */
    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 12px;
      font-family: 'Circular Std', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      margin-bottom: 12px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .new-chat-btn:hover {
      background-color: #272726;
      border-color: var(--border-focus);
    }

    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 11px 8px 33px;
      font-family: 'Circular Std', sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--border-focus);
    }

    .sidebar-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
      padding: 4px 6px 8px 6px;
      font-weight: 500;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
    }

    .patient-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-family: 'Circular Std', sans-serif;
      transition: all 0.15s ease;
      width: 100%;
    }

    .patient-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    .patient-item.active {
      background-color: var(--surface-box);
      border-color: var(--border-subtle);
    }

    .patient-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      background-color: #262624;
      border: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .patient-info {
      overflow: hidden;
      flex: 1;
    }

    .patient-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .patient-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .patient-age {
      font-size: 11.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .patient-meta {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Main Area */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      position: relative;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      width: 100%;
      position: sticky;
      top: 0;
      background-color: var(--bg-main);
      z-index: 20;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 7px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background-color: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .header-chat-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      display: none;
    }

    .header-chat-title.visible {
      display: inline-block;
    }

    /* Doctor Profile Badge on Top Right */
    .doc-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 11px 5px 6px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--surface-box);
      cursor: pointer;
      font-family: 'Circular Std', sans-serif;
      font-size: 12.5px;
      color: var(--text-primary);
    }

    .doc-avatar-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background-color: #272725;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Stage */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 20px 24px 20px;
      position: relative;
    }

    /* Main stage in empty state (centered) */
    .main-stage.empty-state {
      align-items: center;
      justify-content: center;
      padding-bottom: 12vh;
    }

    /* Hero Greeting with Roots Logo */
    .hero-greeting {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      text-align: center;
    }

    .hero-greeting.hidden {
      display: none;
    }

    .roots-logo-svg {
      width: 38px;
      height: 25px;
      flex-shrink: 0;
      color: var(--text-primary);
    }

    /* Refined New York Serif */
    .serif-header {
      font-family: 'New York', -apple-system-ui-serif, ui-serif, Georgia, serif;
      font-size: 44px;
      line-height: 1.12;
      letter-spacing: -0.04em;
      color: var(--text-primary);
      font-weight: 300;
    }

    /* Conversation Thread (shown when chatting) */
    .chat-thread {
      display: none;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      flex: 1;
      padding-bottom: 20px;
    }

    .chat-thread.visible {
      display: flex;
    }

    /* Message Bubbles */
    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
    }

    .user-bubble {
      max-width: 82%;
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      border-radius: 16px 16px 4px 16px;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .assistant-bubble {
      width: 100%;
      background-color: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px 16px 16px 4px;
      padding: 18px 20px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-primary);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .assistant-bubble-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 8px;
    }

    /* Composer Card */
    .composer-container {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      transition: all 0.2s ease;
    }

    .composer-container.docked-bottom {
      position: sticky;
      bottom: 20px;
      z-index: 15;
    }

    .composer-card {
      width: 100%;
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px 16px 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 114px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      transition: border-color 0.15s ease;
    }

    .composer-card:focus-within {
      border-color: var(--border-focus);
    }

    .composer-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Circular Std', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .composer-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* [ Chat | Details ] Toggle */
    .segmented-toggle {
      display: inline-flex;
      align-items: center;
      background-color: var(--pill-bg);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 4px 11px;
      font-size: 12.5px;
      font-family: 'Circular Std', sans-serif;
      font-weight: 400;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--pill-active);
      color: var(--text-primary);
      font-weight: 500;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      user-select: none;
    }

    .model-name {
      color: var(--text-primary);
      font-weight: 500;
    }

    .model-tier {
      color: var(--text-secondary);
    }

    /* Chevron-Up Send Button */
    .send-chevron-btn {
      background-color: #272725;
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }

    .send-chevron-btn:hover {
      background-color: #333330;
      transform: translateY(-1px);
    }

    /* Details Modal Backdrop & Container */
    .details-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .details-modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .details-modal {
      width: 100%;
      max-width: 660px;
      max-height: 88vh;
      overflow-y: auto;
      background-color: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 22px;
      padding: 34px 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      position: relative;
      transform: translateY(14px) scale(0.97);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .details-modal-backdrop.open .details-modal {
      transform: translateY(0) scale(1);
    }

    .modal-close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .modal-close-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
    }

    /* Stylized Center Profile Header */
    .modal-profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .modal-profile-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #242423;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .modal-patient-name {
      font-family: 'New York', -apple-system-ui-serif, Georgia, serif;
      font-size: 24px;
      font-weight: 300;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .modal-badge-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .modal-tag {
      font-size: 11.5px;
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 3px 10px;
      color: var(--text-secondary);
    }

    /* Editorial Details (Pure Typography & Generous Spacing - NO Boxed Cards) */
    .modal-columns-wrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 26px;
    }

    .modal-col {
      display: flex;
      flex-direction: column;
    }

    .col-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 22px;
      letter-spacing: -0.01em;
    }

    .detail-block {
      margin-bottom: 24px;
    }

    .detail-block:last-child {
      margin-bottom: 0;
    }

    .detail-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .detail-content {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    .qloo-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 12px 0;
    }

    .qloo-chip {
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-primary);
    }

    .question-card {
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 10px;
      font-size: 13px;
    }

    /* Responsive Design */
    @media (max-width: 640px) {
      .serif-header {
        font-size: 30px;
      }
      .roots-logo-svg {
        width: 32px;
        height: 20px;
      }
      .hero-greeting {
        gap: 10px;
        margin-bottom: 22px;
      }
      .main-stage {
        padding: 12px 14px 18px 14px;
      }
      .top-bar {
        padding: 12px 14px;
      }
      .details-modal {
        padding: 24px 20px;
      }
      .modal-columns-wrap {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .composer-card {
        padding: 14px 12px 10px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Blur Backdrop Overlay (closes sidebar when clicked) -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Slide-out Sidebar with + New Consultation & Patient Profiles -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Clinic Consultations</span>
        <button type="button" class="icon-btn" id="closeSidebarBtn" aria-label="Close sidebar">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <path d="M4.5 4.5L13.5 13.5M13.5 4.5L4.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- New Consultation Button -->
      <button type="button" class="new-chat-btn" id="newChatSidebarBtn">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
          <path d="M9 3.5V14.5M3.5 9H14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span>New Consultation</span>
      </button>

      <!-- Search Bar -->
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12.2 12.2L15.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          id="patientSearchInput"
          class="search-input"
          placeholder="Search patients..."
        />
      </div>

      <div class="sidebar-section-label">Patients in Clinic (4)</div>
      <div class="patient-list" id="patientList"></div>
    </aside>

    <!-- Main Content Area -->
    <div class="main-area">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button type="button" class="icon-btn" id="openSidebarBtn" aria-label="Open sidebar" title="Open Patient Sidebar">
            <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
              <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" stroke="currentColor" stroke-width="1.4" />
              <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" stroke="currentColor" stroke-width="1.4" />
            </svg>
          </button>
          <span class="header-chat-title" id="headerChatTitle"></span>
        </div>

        <!-- Doctor Profile Badge on Top Right -->
        <div class="doc-badge" title="Attending Physician: Dr. Noble">
          <div class="doc-avatar-circle">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 2v2" />
              <path d="M5 2v2" />
              <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
              <path d="M8 15a6 6 0 0 0 12 0v-3" />
              <circle cx="20" cy="10" r="2" />
            </svg>
          </div>
          <span style="font-weight: 500;">Dr. Noble</span>
        </div>
      </header>

      <!-- Main Stage -->

    // Local Chat Store by Patient ID

    let activePatient = null;

    const sidebar = document.getElementById('sidebar');

    const composerContainer = document.getElementById('composerContainer');
    const promptInput = document.getElementById('promptInput');

    const headerChatTitle = document.getElementById('headerChatTitle');

    const detailsModalBackdrop = document.getElementById('detailsModalBackdrop');

    function toggleSidebar(open) {
      const isOpen = typeof open === 'boolean' ? open : !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', isOpen);
      sidebarBackdrop.classList.toggle('active', isOpen);
    }

    openSidebarBtn.addEventListener('click', () => toggleSidebar(true));
    closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
    quickSidebarBtn.addEventListener('click', () => toggleSidebar(true));
    sidebarBackdrop.addEventListener('click', () => toggleSidebar(false));

    function closeDetailsModal() {
      detailsModalBackdrop.classList.remove('open');
      modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === 'Chat'));
      currentMode = 'Chat';
    }

    closeDetailsModalBtn.addEventListener('click', closeDetailsModal);
    detailsModalBackdrop.addEventListener('click', (e) => {
      if (e.target === detailsModalBackdrop) {
        closeDetailsModal();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && detailsModalBackdrop.classList.contains('open')) {
        closeDetailsModal();
      }
    });

    // Details Modal with Stylized Top Profile and Pure Whitespace 2-Column Grid

      const p = activePatient || PATIENTS[0];

      detailsModalBody.innerHTML = `

    // Reset to Empty State / New Consultation
    function startNewChat() {
      activePatient = null;
      currentMode = 'Chat';
      modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === 'Chat'));

      // Center stage & show hero
      mainStage.classList.add('empty-state');
      heroGreeting.classList.remove('hidden');
      chatThread.classList.remove('visible');
      chatThread.innerHTML = '';
      composerContainer.classList.remove('docked-bottom');

      headerChatTitle.classList.remove('visible');
      headerChatTitle.textContent = '';
      promptInput.value = '';
      promptInput.placeholder = 'How can I help you today?';
      renderPatientList();
      toggleSidebar(false);
      promptInput.focus();
    }

    newChatSidebarBtn.addEventListener('click', () => {
      startNewChat();
    });

    // Load an existing patient's consultation chat
    function selectPatientChat(patient) {
      activePatient = patient;
      toggleSidebar(false);
      renderPatientList(patientSearchInput.value);

      headerChatTitle.textContent = `${patient.name} (${patient.id})`;
      headerChatTitle.classList.add('visible');

      currentMode = 'Chat';
      modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === 'Chat'));
      renderChatThread();
    }

    function renderChatThread() {
      if (!activePatient) return;
      const history = CHAT_HISTORY[activePatient.id] || [];

      if (history.length === 0) {
        mainStage.classList.remove('empty-state');
        heroGreeting.classList.add('hidden');
        chatThread.classList.add('visible');
        composerContainer.classList.add('docked-bottom');
        promptInput.placeholder = `Ask about ${activePatient.name.split(' ')[0]}'s lifestyle or symptoms...`;

        chatThread.innerHTML = `
          <div class="message-row assistant">
            <div class="assistant-bubble">
              <div class="assistant-bubble-header">
                <span>Roots Clinical Agent · Qloo Taste AI</span>
              </div>
              <p>Ready to analyze <strong>${activePatient.name}</strong> (${activePatient.age}y, ${activePatient.location}).</p>
              <p style="color:var(--text-secondary);margin-top:6px;">Chief Complaint: <em>"${activePatient.chiefComplaint}"</em>. Ask any question or press send to pull their peer-group lifestyle profile and diagnostic probes.</p>
            </div>
          </div>
        `;
        return;
      }

      // Render existing conversation
      mainStage.classList.remove('empty-state');
      heroGreeting.classList.add('hidden');
      chatThread.classList.add('visible');
      composerContainer.classList.add('docked-bottom');
      promptInput.placeholder = `Ask follow-up question about ${activePatient.name.split(' ')[0]}...`;

      chatThread.innerHTML = history
        .map((msg) => {
          if (msg.role === 'user') {
            return `
              <div class="message-row user">
                <div class="user-bubble">${escapeHtml(msg.text)}</div>
              </div>
            `;
          } else {
            const chips = [
              ...(msg.places || []).map((p) => `<span class="qloo-chip">📍 ${p}</span>`),
              ...(msg.brands || []).map((b) => `<span class="qloo-chip">🏷️ ${b}</span>`),
              ...(msg.tags || []).map((t) => `<span class="qloo-chip"># ${t}</span>`)
            ].join('');

            const questionsHtml = (msg.questions || [])
              .map(
                (q) => `
                <div class="question-card">
                  <div style="font-size:11px;color:var(--text-secondary);font-weight:700;margin-bottom:2px;">PROBE: ${q.trigger.toUpperCase()}</div>
                  <div style="font-weight:500;margin-bottom:3px;color:var(--text-primary);">${q.question}</div>
                  <div style="font-size:11.5px;color:var(--text-secondary);">${q.clinicalWhy}</div>
                </div>
              `
              )
              .join('');

            return `
              <div class="message-row assistant">
                <div class="assistant-bubble">
                  <div class="assistant-bubble-header">
                    <span>Roots Clinical Agent · Qloo Taste AI (${msg.location || activePatient.location})</span>
                  </div>
                  <div>
                    <strong style="color:var(--text-primary);">Peer Lifestyle &amp; Environmental Factors:</strong>
                    <ul style="padding-left:18px;margin:6px 0 10px 0;color:var(--text-secondary);">
                      ${(msg.lifestyle || activePatient.lifestyleSummary).map((l) => `<li style="margin-bottom:3px;">${l}</li>`).join('')}
                    </ul>
                  </div>
                  ${chips ? `<div class="qloo-chip-row">${chips}</div>` : ''}
                  <div style="margin-top:14px;">
                    <strong style="color:var(--text-primary);">Diagnostic Questions for Dr. Noble:</strong>
                    ${questionsHtml}
                  </div>
                </div>
              </div>
            `;
          }
        })
        .join('');

      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function renderPatientList(filterText = '') {
      const q = filterText.trim().toLowerCase();
      const filtered = PATIENTS.filter(
        (p) =>
          p.name.toLowerCase().includes(q) ||
          p.location.toLowerCase().includes(q) ||
          p.chiefComplaint.toLowerCase().includes(q) ||
          p.id.toLowerCase().includes(q)
      );

      patientListEl.innerHTML = filtered
        .map((p) => {
          const isActive = activePatient && p.id === activePatient.id;
          return `
            <button type="button" class="patient-item ${isActive ? 'active' : ''}" data-id="${p.id}">
              <div class="patient-avatar">${p.initials}</div>
              <div class="patient-info">

                  <span class="patient-age">${p.age}y · ${p.sex[0]}</span>

                <div class="patient-meta" style="color: var(--text-secondary);">${p.chiefComplaint}</div>
              </div>
            </button>
          `;
        })
        .join('');

      patientListEl.querySelectorAll('.patient-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const found = PATIENTS.find((pt) => pt.id === btn.dataset.id);
          if (found) {
            selectPatientChat(found);
          }
        });
      });
    }

    patientSearchInput.addEventListener('input', (e) => {
      renderPatientList(e.target.value);

    // Send Message / Chat Interaction
    async function handleSendMessage() {
      const text = promptInput.value.trim();
      
      // If no patient is currently selected (e.g. from New Consultation), create one dynamically!
      if (!activePatient) {
        if (!text) {
          activePatient = PATIENTS[0];
        } else {
          // Detect or create new consultation patient from prompt
          const newId = 'PT-' + Math.floor(2050 + Math.random() * 50);
          const firstWord = text.split(' ')[0] || 'Patient';
          const newPt = {
            id: newId,
            initials: firstWord.slice(0, 2).toUpperCase(),
            name: text.length > 28 ? text.slice(0, 28) + '...' : text,
            age: 32,
            sex: 'Patient',
            qlooAge: '24_and_younger',
            qlooGender: 'male',
            qlooLocation: 'Enugu',
            qlooTagQuery: 'lifestyle',
            maritalStatus: 'Consultation Intake',
            occupation: 'New Consultation Case',
            location: 'Client Intake Environment',
            vitals: 'Vitals pending examination',
            chiefComplaint: text,
            triageNote: text,
            lifestyleSummary: [
              'Daily environmental & peer cohort factors being analyzed via Qloo',
              'Regional food, recreational, and commute habits'
            ],
            diagnosticQuestions: [
              {
                trigger: 'Initial Lifestyle Anamnesis',
                question: `"How long have these symptoms been present, and do they change based on your daily physical routine or meals?"`,
                clinicalWhy: 'Gathers baseline temporal and lifestyle triggers.'
              }
            ]
          };
          PATIENTS.unshift(newPt);
          activePatient = newPt;
          renderPatientList();
        }
      }

      const userText = text || `Analyze lifestyle and diagnostic questions for ${activePatient.name}`;
      promptInput.value = '';

      if (!CHAT_HISTORY[activePatient.id]) {
        CHAT_HISTORY[activePatient.id] = [];
      }

      CHAT_HISTORY[activePatient.id].push({
        role: 'user',
        text: userText
      });

      currentMode = 'Chat';
      modeButtons.forEach((b) => b.classList.toggle('active', b.dataset.mode === 'Chat'));
      renderChatThread();

      const thread = document.getElementById('chatThread');
      const tempId = 'temp-' + Date.now();
      const typingEl = document.createElement('div');
      typingEl.className = 'message-row assistant';
      typingEl.id = tempId;
      typingEl.innerHTML = `
        <div class="assistant-bubble">
          <div class="assistant-bubble-header">
            <span>Querying Qloo Taste AI Graph...</span>
          </div>
          <p style="color:var(--text-secondary);">Connecting to <code>hackathon.api.qloo.com</code> for ${activePatient.name}'s peer demographic in ${activePatient.location}...</p>
        </div>
      `;
      thread.appendChild(typingEl);
      window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      try {
        const res = await fetch(
          `/api/qloo/lifestyle?location=${encodeURIComponent(activePatient.qlooLocation)}&age=${encodeURIComponent(activePatient.qlooAge)}&gender=${encodeURIComponent(activePatient.qlooGender)}&tagQuery=${encodeURIComponent(activePatient.qlooTagQuery)}`
        );
        const qloo = await res.json();

        const places = (qloo.places || []).slice(0, 4).map((p) => p.name);
        const brands = (qloo.brands || []).slice(0, 4).map((b) => b.name);
        const tags = (qloo.tags || []).slice(0, 4).map((t) => t.name);

        const assistantResponse = {
          role: 'assistant',
          patientName: activePatient.name,
          location: activePatient.location,
          places,
          brands,
          tags,
          lifestyle: activePatient.lifestyleSummary,
          questions: activePatient.diagnosticQuestions
        };

        CHAT_HISTORY[activePatient.id].push(assistantResponse);
        const el = document.getElementById(tempId);
        if (el) el.remove();
        renderChatThread();
      } catch (err) {
        const el = document.getElementById(tempId);
        if (el) {
          el.innerHTML = `
            <div class="assistant-bubble">
              <p style="color:#E57373;">Error connecting to Qloo API: ${escapeHtml(err.message)}</p>
            </div>
          `;
        }
      }
    }

    sendBtn.addEventListener('click', handleSendMessage);
    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    // Toggle [ Chat | Details ]
    const modeButtons = document.querySelectorAll('#modeToggle .seg-btn');
    modeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.mode;
        if (mode === 'Details') {
          openDetailsModal();
        } else {
          modeButtons.forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          currentMode = 'Chat';
          if (activePatient) {
            renderChatThread();
          }
        }
      });
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Initial render
    renderPatientList();
  </script>
</body>
</html>
