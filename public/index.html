<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roots — Clinical Lifestyle Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&display=swap" rel="stylesheet">
  <style>
    /* Bundled Local Circular Std for Body */
    @font-face {
      font-family: 'Circular Std';
      src: url('/fonts/CircularStd-Book.woff') format('woff');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Circular Std';
      src: url('/fonts/CircularStd-Medium.woff') format('woff');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Circular Std';
      src: url('/fonts/CircularStd-Bold.woff') format('woff');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* Bundled Local Silver Editorial */
    @font-face {
      font-family: 'The Silver Editorial';
      src: url('/fonts/TheSilverEditorial-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-cream: #F7F4EC;
      --bg-sidebar: #EFECE3;
      --surface-box: #EFECE3;
      --surface-card: #FAF8F3;
      --border-subtle: rgba(31, 29, 25, 0.12);
      --border-focus: rgba(10, 228, 72, 0.55);
      --text-primary: #1C1B18;
      --text-secondary: #68655D;
      --text-placeholder: #8A867D;
      /* GSAP Signature Green */
      --gsap-green: #0AE448;
      --gsap-green-ink: #089930;
      --gsap-green-soft: rgba(10, 228, 72, 0.14);
      --pill-bg: #E4E0D5;
      --pill-active: #1C1B18;
      --header-serif: 'Newsreader', 'Instrument Serif', 'EB Garamond', Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-cream);
      color: var(--text-primary);
      font-family: 'Circular Std', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
      width: 100%;
      position: relative;
      overflow-x: hidden;
    }

    /* Slide-out Sidebar for Attended Patients */
    .sidebar {
      width: 300px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 16px 14px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 40;
      transform: translateX(-100%);
      transition: transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 4px 14px 4px;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: -0.01em;
    }

    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      background-color: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 8px 11px 8px 33px;
      font-family: 'Circular Std', sans-serif;
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--gsap-green-ink);
    }

    .sidebar-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      padding: 4px 6px 8px 6px;
      font-weight: 500;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
      flex: 1;
    }

    .patient-item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-family: 'Circular Std', sans-serif;
      transition: all 0.15s ease;
      width: 100%;
    }

    .patient-item:hover {
      background-color: rgba(28, 27, 24, 0.04);
    }

    .patient-item.active {
      background-color: var(--bg-cream);
      border-color: var(--border-subtle);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .patient-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: #111;
      background-color: var(--gsap-green);
      flex-shrink: 0;
      position: relative;
    }

    .patient-info {
      overflow: hidden;
      flex: 1;
    }

    .patient-name-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .patient-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .patient-age {
      font-size: 11.5px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .patient-meta {
      font-size: 12px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    /* Main Content Wrapper */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      width: 100%;
      transition: padding-left 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-area.shifted {
      padding-left: 300px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      width: 100%;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 7px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background-color: rgba(28, 27, 24, 0.06);
      color: var(--text-primary);
    }

    /* Doctor Profile Icon on Top Right */
    .doc-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 4px 10px 4px 5px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background-color: var(--surface-box);
      cursor: pointer;
      font-family: 'Circular Std', sans-serif;
      font-size: 12.5px;
      color: var(--text-primary);
    }

    .doc-avatar-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #1C1B18;
      color: var(--gsap-green);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .doc-status-dot {
      position: absolute;
      right: -1px;
      bottom: -1px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--gsap-green);
      border: 1.5px solid var(--bg-cream);
    }

    /* Top Center Pill */
    .plan-pill-wrap {
      display: flex;
      justify-content: center;
      margin-top: 2px;
    }

    .plan-pill {
      background-color: rgba(28, 27, 24, 0.05);
      border-radius: 9999px;
      padding: 5px 14px;
      font-size: 12.5px;
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .gsap-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--gsap-green);
      box-shadow: 0 0 8px var(--gsap-green);
    }

    .serif-cycle-btn {
      background: transparent;
      border: none;
      color: var(--gsap-green-ink);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-family: 'Circular Std', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }

    /* Main Stage */
    .main-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 20px 9vh 20px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .hero-greeting {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 26px;
      text-align: center;
    }

    /* Refined Editorial Serif Header */
    .serif-header {
      font-family: var(--header-serif);
      font-size: 42px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      font-weight: 300;
    }

    /* Active Patient Context Strip (Above Composer when selected) */
    .active-patient-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: var(--gsap-green-soft);
      border: 1px solid rgba(10, 228, 72, 0.35);
      color: var(--text-primary);
      padding: 5px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      margin-bottom: 14px;
    }

    /* Composer Card */
    .composer-card {
      width: 100%;
      max-width: 650px;
      background-color: var(--surface-box);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px 16px 12px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 114px;
      box-shadow: 0 2px 12px rgba(31, 29, 25, 0.03);
      transition: border-color 0.15s ease;
    }

    .composer-card:focus-within {
      border-color: var(--border-focus);
    }

    .composer-textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'Circular Std', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-primary);
    }

    .composer-textarea::placeholder {
      color: var(--text-placeholder);
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .controls-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* [ Chat | Details ] Toggle */
    .segmented-toggle {
      display: inline-flex;
      align-items: center;
      background-color: var(--pill-bg);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }

    .seg-btn {
      background: transparent;
      border: none;
      border-radius: 6px;
      padding: 4px 11px;
      font-size: 12.5px;
      font-family: 'Circular Std', sans-serif;
      font-weight: 400;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-btn.active {
      background: var(--pill-active);
      color: var(--gsap-green);
      font-weight: 500;
    }

    .controls-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      user-select: none;
    }

    .model-name {
      color: var(--text-primary);
      font-weight: 500;
    }

    .model-tier {
      color: var(--text-secondary);
    }

    .send-wave-btn {
      background-color: #1C1B18;
      border: none;
      color: var(--gsap-green);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease;
    }

    .send-wave-btn:hover {
      transform: scale(1.05);
    }

    /* Patient Hospital File (Details Panel) & Qloo Lifestyle Output */
    .workspace-panel {
      width: 100%;
      max-width: 650px;
      margin-top: 16px;
      background-color: var(--surface-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px 20px;
      display: none;
    }

    .workspace-panel.visible {
      display: block;
    }

    .file-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .file-title {
      font-size: 15px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .file-id-tag {
      font-size: 11.5px;
      background-color: var(--surface-box);
      padding: 3px 8px;
      border-radius: 6px;
      color: var(--text-secondary);
    }

    .file-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px 16px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .file-field-label {
      color: var(--text-secondary);
      font-size: 11.5px;
      margin-bottom: 2px;
    }

    .file-field-value {
      color: var(--text-primary);
      font-weight: 500;
    }

    .triage-box {
      background-color: var(--surface-box);
      border-left: 3px solid var(--gsap-green);
      padding: 10px 12px;
      border-radius: 0 10px 10px 0;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .qloo-action-btn {
      background-color: #1C1B18;
      color: var(--gsap-green);
      border: none;
      border-radius: 10px;
      padding: 9px 14px;
      font-family: 'Circular Std', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .qloo-results-box {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      font-size: 13.5px;
      line-height: 1.55;
    }

    .qloo-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 12px 0;
    }

    .qloo-chip {
      background-color: var(--gsap-green-soft);
      border: 1px solid rgba(10, 228, 72, 0.35);
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }

    .question-card {
      background-color: var(--bg-cream);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Slide-out Sidebar with Search & 4 Attended Patient Profiles -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <!-- Simple Roots Logo in GSAP Green -->
          <svg width="20" height="20" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="3.2" fill="#0AE448" />
            <g stroke="#089930" stroke-width="2.4" stroke-linecap="round">
              <path d="M18 4V13" />
              <path d="M8 8.5L14.5 15" />
              <path d="M28 8.5L21.5 15" />
              <path d="M18 23V32" />
              <path d="M14.5 21.5C11.5 24.5 9 27 7.5 30.5" />
              <path d="M21.5 21.5C24.5 24.5 27 27 28.5 30.5" />
            </g>
          </svg>
          <span>Roots Clinic</span>
        </div>
        <button type="button" class="icon-btn" id="closeSidebarBtn" aria-label="Close sidebar">
          <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
            <path d="M4.5 4.5L13.5 13.5M13.5 4.5L4.5 13.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <!-- Client Search Bar -->
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 18 18" fill="none">
          <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12.2 12.2L15.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <input
          type="text"
          id="patientSearchInput"
          class="search-input"
          placeholder="Search clients..."
        />
      </div>

      <div class="sidebar-section-label">Attended &amp; Waiting Clients (4)</div>

      <div class="patient-list" id="patientList"></div>
    </aside>

    <!-- Main Area -->
    <div class="main-area" id="mainArea">
      <!-- Top Bar -->
      <header class="top-bar">
        <button type="button" class="icon-btn" id="openSidebarBtn" aria-label="Toggle patient sidebar" title="View Attended Patients">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" stroke="currentColor" stroke-width="1.4" />
            <line x1="7.5" y1="3.5" x2="7.5" y2="16.5" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>

        <!-- Doctor Profile Icon (Replaces Ghost Icon) -->
        <div class="doc-badge" title="Attending Physician: Dr. Noble">
          <div class="doc-avatar-circle">
            <!-- Minimal Doctor + Stethoscope Icon -->
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 2v2" />
              <path d="M5 2v2" />
              <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1" />
              <path d="M8 15a6 6 0 0 0 12 0v-3" />
              <circle cx="20" cy="10" r="2" />
            </svg>
            <span class="doc-status-dot"></span>
          </div>
          <span style="font-weight: 500;">Dr. Noble</span>
        </div>
      </header>

      <!-- Top Center Pill -->
      <div class="plan-pill-wrap">
        <div class="plan-pill">
          <span class="gsap-dot"></span>
          <span>Roots Clinical · Qloo Taste AI</span>
          <span style="opacity: 0.4;">·</span>
          <button type="button" class="serif-cycle-btn" id="serifCycleBtn" title="Click to switch header serif">
            Serif: Newsreader
          </button>
        </div>
      </div>

      <!-- Centered Stage -->
      <main class="main-stage">
        <!-- Simple Roots Logo + Greeting Header -->
        <div class="hero-greeting">
          <svg width="34" height="34" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink: 0;">
            <!-- Minimalist Roots Starburst Mark in GSAP Green -->
            <circle cx="18" cy="18" r="3.4" fill="#0AE448" />
            <g stroke="#089930" stroke-width="2.4" stroke-linecap="round">
              <!-- Upper canopy pulse rays -->
              <path d="M18 3.5V12.5" />
              <path d="M7.5 7.5L14 14" />
              <path d="M28.5 7.5L22 14" />
              <path d="M3.5 18H12.5" />
              <path d="M23.5 18H32.5" />
              <!-- Lower organic root tendrils -->
              <path d="M18 23.5V32.5" />
              <path d="M14 22C11 25 8.5 27.5 7 31.5" />
              <path d="M22 22C25 25 27.5 27.5 29 31.5" />
            </g>
          </svg>
          <h1 class="serif-header" id="greetingHeader">Good morning, Doctor Noble</h1>
        </div>

        <!-- Selected Patient Indicator Pill -->
        <div class="active-patient-pill" id="activePatientBanner">
          <!-- Populated dynamically -->
        </div>

        <!-- Composer Card -->
        <div class="composer-card">
          <textarea
            id="promptInput"
            class="composer-textarea"
            rows="2"
            placeholder="Describe patient symptoms or ask Qloo about their local lifestyle..."
          ></textarea>

          <div class="composer-footer">
            <div class="controls-left">
              <button type="button" class="icon-btn" id="QuickSidebarBtn" title="Select patient from sidebar" style="padding: 4px;">
                <svg width="16" height="16" viewBox="0 0 18 18" fill="none">
                  <path d="M9 3.5V14.5M3.5 9H14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
              </button>

              <!-- [ Chat | Details ] Toggle -->
              <div class="segmented-toggle" id="modeToggle">
                <button type="button" class="seg-btn active" data-mode="Chat">Chat</button>
                <button type="button" class="seg-btn" data-mode="Details">Details</button>
              </div>
            </div>

            <div class="controls-right">
              <div class="model-badge">
                <span class="model-name">Qloo Taste Graph</span>
                <span class="model-tier">v2</span>
              </div>

              <button type="button" class="send-wave-btn" id="analyzeBtn" title="Run Lifestyle Diagnostic Analysis">
                <svg width="15" height="15" viewBox="0 0 18 18" fill="none">
                  <line x1="3.5" y1="7" x2="3.5" y2="11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <line x1="6.2" y1="4.5" x2="6.2" y2="13.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <line x1="9" y1="3" x2="9" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <line x1="11.8" y1="5.5" x2="11.8" y2="12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />

        </div>

        <!-- Dynamic Panel for [Details] (Hospital File) or [Chat] (Qloo Lifestyle & Diagnostic Questions) -->
        <section class="workspace-panel" id="workspacePanel"></section>
      </main>
    </div>
  </div>

  <script>
    // 4 Realistic Patient Files Attended to by Dr. Noble
    const PATIENTS = [
      {
        id: 'PT-2041',
        initials: 'CO',

          {

          },
          {

            question: '"Did you eat roadside Abacha with watery stool right before this, or did the pain start around your navel before moving to the right side?"',
            clinicalWhy: 'Rules out acute gastroenteritis / food poisoning vs. surgical appendicitis.'
          }
        ]
      },
      {
        id: 'PT-2038',
        initials: 'TA',
        name: 'Tunde Adeyemi',
        age: 46,
        sex: 'Male',
        qlooAge: '36_to_55',
        qlooGender: 'male',
        qlooLocation: 'Houston',
        qlooTagQuery: 'nigerian',
        maritalStatus: 'Married · Father of 4 children',
        occupation: '9-to-5 Senior Operations Manager (Long daily commute)',
        location: 'Southwest Houston, TX (Nigerian Diaspora Community)',
        vitals: 'BP 148/95 mmHg · HR 84 bpm · BMI 28.4',
        chiefComplaint: 'Pounding morning headaches, nighttime chest burn & daytime fatigue',
        triageNote: 'Patient says he does not smoke and only eats "normal home food." Complains of waking up with heavy headaches and sour taste in throat at 2 AM.',
        lifestyleSummary: [
          'Late-night heavy swallow meals (Pounded Yam / Eba / Egusi) at 9:30 PM after long traffic commute',
          'High bouillon-cube seasoning load (Maggi/Knorr hidden sodium) + weekend Suya / Pepper soup spots',
          'After-work herbal bitters / ginger tonics + routine OTC Ibuprofen for commuter body aches'
        ],
        diagnosticQuestions: [
          {
            trigger: '9:30 PM Post-Commute Swallow Meal',
            question: '"What time do you eat your main swallow and soup after getting back from work, and how soon after do you lie down?"',
            clinicalWhy: 'Explains nocturnal gastroesophageal reflux (GERD) mimicking cardiac chest tightness.'
          },
          {
            trigger: 'Herbal Bitters & Evening Painkillers',
            question: '"Do you take herbal bitters for \'body cleansing\' or pop Ibuprofen/painkillers after traffic?"',
            clinicalWhy: 'NSAIDs + bitters simultaneously trigger gastric irritation and spike morning blood pressure.'
          },
          {
            trigger: 'Household Seasoning & Weekend Suya',
            question: '"How many seasoning cubes go into the family soup pot, and do you visit Suya lounges on Friday nights?"',
            clinicalWhy: 'Uncovers massive hidden sodium driving his 148/95 morning hypertension even though he "never adds table salt."'
          }
        ]
      },
      {
        id: 'PT-2035',
        initials: 'ML',
        name: 'Maya Lin',
        age: 23,
        sex: 'Female',
        qlooAge: '24_and_younger',
        qlooGender: 'female',
        qlooLocation: 'Los Angeles',
        qlooTagQuery: 'matcha',
        maritalStatus: 'Single · Lives with 2 roommates',
        occupation: 'Junior UX Designer & Night Grad Student',
        location: 'Koreatown, Los Angeles, CA',
        vitals: 'BP 112/72 mmHg · HR 108 bpm (Sinus tachycardia) · Ferritin Low',
        chiefComplaint: 'Racing heart palpitations, hand tremors, stomach cramps & insomnia',
        triageNote: 'History of mild iron-deficiency anemia (on oral iron). Reports sudden racing heart in the afternoons and inability to sleep before 3 AM.',
        lifestyleSummary: [
          'Late-night K-Town cafe study culture (Ceremonial iced matcha & espresso tonics)',
          'Functional fitness energy drinks (200mg+ caffeine cans like Celsius/Alani Nu before Pilates)',
          'Late-night spicy Korean hotpot / fire-noodle dinners with roommates after 10 PM class'
        ],
        diagnosticQuestions: [
          {
            trigger: 'Matcha Tannins Blocking Iron Supplement',
            question: '"Are you washing down your morning iron pill with iced matcha or coffee before work?"',
            clinicalWhy: 'Matcha/tea polyphenols block up to 70% of iron absorption, worsening anemia-induced heart palpitations.'
          },
          {
            trigger: 'Hidden 200mg+ "Fitness" Energy Cans',
            question: '"Even if you don\'t drink regular coffee, do you drink Celsius or pre-workout cans before Pilates or night class?"',
            clinicalWhy: 'Identifies unrecognized caffeine toxicity causing her resting HR of 108 bpm and hand tremors.'
          }
        ]
      },
      {
        id: 'PT-2029',
        initials: 'AN',
        name: 'Amara Nwosu',
        age: 64,
        sex: 'Female',
        qlooAge: '55_and_older',
        qlooGender: 'female',
        qlooLocation: 'Enugu',
        qlooTagQuery: 'tea',
        maritalStatus: 'Widowed · Grandmother (Lives with daughter & 3 grandkids)',
        occupation: 'Retired Principal & Active Church Women’s Leader',
        location: 'Independence Layout, Enugu, Nigeria',
        vitals: 'BP 138/86 mmHg · HR 78 bpm · Blood Glucose (Fasting) 92 mg/dL',
        chiefComplaint: 'Burning upper stomach pain, afternoon dizziness & knee stiffness',
        triageNote: 'Patient has osteoarthritis in both knees. Reports burning epigastric pain and lightheadedness especially on Sundays and Wednesdays.',
        lifestyleSummary: [
          'Frequent church/community fasting until mid-afternoon on Wednesdays & Sundays',
          'Taking daily diclofenac/arthrotec ("joint medicine") on an empty stomach for knee pain',
          'Concentrated ginger/garlic/lemon hot teas first thing in the morning'
        ],
        diagnosticQuestions: [
          {
            trigger: 'Joint Painkillers During Morning Fast',
            question: '"Mama, on days you fast or go for morning fellowship, do you still take your knee pain medicine before eating?"',
            clinicalWhy: 'Taking NSAIDs (diclofenac/ibuprofen) during fasting directly causes peptic ulceration and epigastric burning.'
          },
          {
            trigger: 'Raw Ginger / Citrus Morning Tonics',
            question: '"Do you drink strong hot ginger and lemon mixtures on an empty stomach every morning?"',
            clinicalWhy: 'Aggravates gastritis when combined with prolonged morning fasting.'
          }
        ]
      }
    ];

    let selectedPatient = PATIENTS[0];
    let currentMode = 'Chat'; // 'Chat' or 'Details'

    const sidebar = document.getElementById('sidebar');
    const mainArea = document.getElementById('mainArea');
    const openSidebarBtn = document.getElementById('openSidebarBtn');
    const closeSidebarBtn = document.getElementById('closeSidebarBtn');
    const quickSidebarBtn = document.getElementById('QuickSidebarBtn');
    const patientListEl = document.getElementById('patientList');
    const patientSearchInput = document.getElementById('patientSearchInput');
    const activePatientBanner = document.getElementById('activePatientBanner');
    const workspacePanel = document.getElementById('workspacePanel');
    const promptInput = document.getElementById('promptInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const serifCycleBtn = document.getElementById('serifCycleBtn');

    // Header Serif Options so Dr. Noble can pick the exact look
    const SERIF_OPTIONS = [
      { label: 'Newsreader', stack: "'Newsreader', Georgia, serif", weight: 300, size: '42px' },
      { label: 'Instrument Serif', stack: "'Instrument Serif', Georgia, serif", weight: 400, size: '46px' },
      { label: 'EB Garamond', stack: "'EB Garamond', Georgia, serif", weight: 400, size: '43px' },
      { label: 'Silver Editorial', stack: "'The Silver Editorial', Georgia, serif", weight: 400, size: '44px' }
    ];
    let serifIndex = 0;

    serifCycleBtn.addEventListener('click', () => {
      serifIndex = (serifIndex + 1) % SERIF_OPTIONS.length;
      const opt = SERIF_OPTIONS[serifIndex];
      const headerEl = document.getElementById('greetingHeader');
      headerEl.style.fontFamily = opt.stack;
      headerEl.style.fontWeight = opt.weight;
      headerEl.style.fontSize = opt.size;
      serifCycleBtn.textContent = `Serif: ${opt.label}`;
    });

    function toggleSidebar(forceOpen) {
      const isOpen = typeof forceOpen === 'boolean' ? forceOpen : !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', isOpen);
      mainArea.classList.toggle('shifted', isOpen);
    }

    openSidebarBtn.addEventListener('click', () => toggleSidebar());
    closeSidebarBtn.addEventListener('click', () => toggleSidebar(false));
    quickSidebarBtn.addEventListener('click', () => toggleSidebar(true));

    function renderPatientList(filterText = '') {
      const q = filterText.trim().toLowerCase();
      const filtered = PATIENTS.filter(
        (p) =>
          p.name.toLowerCase().includes(q) ||
          p.location.toLowerCase().includes(q) ||
          p.chiefComplaint.toLowerCase().includes(q) ||
          p.id.toLowerCase().includes(q)
      );

      patientListEl.innerHTML = filtered
        .map((p) => {
          const isActive = p.id === selectedPatient.id;
          return `
            <button type="button" class="patient-item ${isActive ? 'active' : ''}" data-id="${p.id}">
              <div class="patient-avatar">${p.initials}</div>
              <div class="patient-info">
                <div class="patient-name-row">
                  <span class="patient-name">${p.name}</span>
                  <span class="patient-age">${p.age}y · ${p.sex[0]}</span>
                </div>
                <div class="patient-meta">${p.location}</div>
                <div class="patient-meta" style="color: var(--gsap-green-ink); font-weight: 500;">${p.chiefComplaint}</div>
              </div>
            </button>
          `;
        })
        .join('');

      patientListEl.querySelectorAll('.patient-item').forEach((btn) => {
        btn.addEventListener('click', () => {
          const found = PATIENTS.find((pt) => pt.id === btn.dataset.id);
          if (found) {
            selectedPatient = found;
            renderPatientList(patientSearchInput.value);
            updateActivePatientUI();
          }
        });
      });
    }

    patientSearchInput.addEventListener('input', (e) => {
      renderPatientList(e.target.value);
    });

    function updateActivePatientUI() {
      activePatientBanner.innerHTML = `
        <span style="width:7px;height:7px;border-radius:50%;background:var(--gsap-green);display:inline-block;"></span>
        <span><strong>${selectedPatient.name}</strong> (${selectedPatient.age}y, ${selectedPatient.location})</span>
        <span style="opacity:0.45;">·</span>
        <span style="color:var(--text-secondary);">${selectedPatient.id}</span>
      `;
      promptInput.placeholder = `Ask Qloo about ${selectedPatient.name.split(' ')[0]}'s lifestyle in ${selectedPatient.qlooLocation} or how it relates to "${selectedPatient.chiefComplaint}"...`;

      if (currentMode === 'Details') {
        renderDetailsPanel();
      } else {
        workspacePanel.classList.remove('visible');
      }
    }

    function renderDetailsPanel() {
      const p = selectedPatient;
      workspacePanel.classList.add('visible');
      workspacePanel.innerHTML = `
        <div class="file-header">
          <div class="file-title">
            <span style="width:9px;height:9px;border-radius:50%;background:var(--gsap-green);display:inline-block;"></span>
            <span>Hospital Patient File — ${p.name}</span>
          </div>
          <span class="file-id-tag">File #${p.id}</span>
        </div>

        <div class="file-grid">
          <div>
            <div class="file-field-label">Age &amp; Sex</div>
            <div class="file-field-value">${p.age} yrs · ${p.sex}</div>
          </div>
          <div>
            <div class="file-field-label">City / Environment</div>
            <div class="file-field-value">${p.location}</div>
          </div>
          <div>
            <div class="file-field-label">Peer Group &amp; Family Status</div>
            <div class="file-field-value">${p.maritalStatus}</div>
          </div>
          <div>
            <div class="file-field-label">Occupation &amp; Routine</div>
            <div class="file-field-value">${p.occupation}</div>
          </div>
          <div style="grid-column: span 2;">
            <div class="file-field-label">Triage Vitals</div>
            <div class="file-field-value">${p.vitals}</div>
          </div>
        </div>

        <div class="triage-box">
          <div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:3px;font-weight:500;">NURSE TRIAGE NOTE &amp; CHIEF COMPLAINT</div>
          <div><strong>${p.chiefComplaint}:</strong> ${p.triageNote}</div>
        </div>

        <button type="button" class="qloo-action-btn" id="runQlooFromFileBtn">
          <span>Analyze Peer Lifestyle &amp; Diagnostic Questions via Qloo</span>
        </button>
        <div id="qlooLiveContainer"></div>
      `;

      document.getElementById('runQlooFromFileBtn').addEventListener('click', () => {
        runQlooLifestyleAnalysis();
      });
    }

    async function runQlooLifestyleAnalysis() {
      const p = selectedPatient;
      workspacePanel.classList.add('visible');

      let container = document.getElementById('qlooLiveContainer');
      if (!container) {
        workspacePanel.innerHTML = `<div id="qlooLiveContainer"></div>`;
        container = document.getElementById('qlooLiveContainer');
      }

      container.innerHTML = `
        <div class="qloo-results-box">
          <span style="color:var(--text-secondary);">Querying Qloo Taste AI Graph (<code>hackathon.api.qloo.com</code>) for <strong>${p.age}y ${p.sex}</strong> in <strong>${p.qlooLocation}</strong>...</span>
        </div>
      `;

      try {
        const res = await fetch(
          `/api/qloo/lifestyle?location=${encodeURIComponent(p.qlooLocation)}&age=${encodeURIComponent(p.qlooAge)}&gender=${encodeURIComponent(p.qlooGender)}&tagQuery=${encodeURIComponent(p.qlooTagQuery)}`
        );
        const qloo = await res.json();

        const livePlaces = (qloo.places || []).slice(0, 4).map((pl) => `<span class="qloo-chip">📍 ${pl.name}</span>`).join('');
        const liveBrands = (qloo.brands || []).slice(0, 4).map((br) => `<span class="qloo-chip">🏷️ ${br.name}</span>`).join('');
        const liveTags = (qloo.tags || []).slice(0, 4).map((tg) => `<span class="qloo-chip"># ${tg.name}</span>`).join('');

        container.innerHTML = `
          <div class="qloo-results-box">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
              <strong style="font-size:14px;">1. Qloo Environment &amp; Peer-Group Lifestyle (${p.location})</strong>
              <span style="font-size:11px;color:var(--gsap-green-ink);font-weight:500;">● Live Qloo API Grounded</span>
            </div>
            <ul style="padding-left:18px;margin-bottom:10px;color:var(--text-primary);">
              ${p.lifestyleSummary.map((item) => `<li style="margin-bottom:4px;">${item}</li>`).join('')}
            </ul>

            <div style="font-size:11.5px;color:var(--text-secondary);margin-top:6px;">Live Qloo Entities &amp; Cultural Signals Retrieved:</div>
            <div class="qloo-chip-row">
              ${livePlaces || '<span class="qloo-chip">📍 Local City Venues</span>'}
              ${liveBrands}
              ${liveTags}
            </div>

            <div style="margin-top:14px;">
              <strong style="font-size:14px;">2. Lifestyle-Grounded Questions for Dr. Noble to Ask</strong>
              ${p.diagnosticQuestions
                .map(
                  (dq) => `
                  <div class="question-card">
                    <div style="font-size:11.5px;color:var(--gsap-green-ink);font-weight:500;margin-bottom:3px;">LIFESTYLE PROBE: ${dq.trigger.toUpperCase()}</div>
                    <div style="font-weight:500;margin-bottom:4px;">${dq.question}</div>
                    <div style="font-size:12px;color:var(--text-secondary);"><strong>Clinical Reasoning:</strong> ${dq.clinicalWhy}</div>
                  </div>
                `
                )
                .join('')}
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="qloo-results-box">Error contacting Qloo endpoint: ${err.message}</div>`;
      }
    }

    // Mode Toggle: [ Chat | Details ]
    const modeButtons = document.querySelectorAll('#modeToggle .seg-btn');
    modeButtons.forEach((btn) => {
      btn.addEventListener('click', () => {
        modeButtons.forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        if (currentMode === 'Details') {
          renderDetailsPanel();
        } else {
          runQlooLifestyleAnalysis();
        }
      });
    });

    analyzeBtn.addEventListener('click', () => {
      runQlooLifestyleAnalysis();
    });

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        runQlooLifestyleAnalysis();
      }
    });

    // Initialize list and default patient
    renderPatientList();
    updateActivePatientUI();
  </script>
</body>
</html>
